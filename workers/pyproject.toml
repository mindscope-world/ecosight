[project]
name = "atlas-workers"
version = "0.1.0"
description = "Capital Atlas data pipeline: crawl, store, extract, evaluate"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.28.1",
  "langchain-groq>=1.1.3",
  "pillow>=12.3.0",
  "psycopg[binary]>=3.2",
]

[project.scripts]
atlas = "atlas_workers.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
